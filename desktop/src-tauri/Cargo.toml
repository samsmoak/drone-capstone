[package]
name = "desktop"
version = "0.1.0"
description = "CropWatcher desktop app — bundles the flight agent"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.6"
tauri-plugin-http = "2.6.1"
uuid = { version = "1.26.1", features = ["v4"] }
# The drone's Wi-Fi password lives in the OS secure store: Keychain on macOS,
# Credential Manager on Windows. Never in a file, never in Supabase.
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Listing nearby networks for the Drone Wi-Fi picker.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSSet", "NSError", "NSEnumerator"] }
objc2-core-wlan = { version = "0.3", features = ["CWWiFiClient", "CWInterface", "CWNetwork", "CWChannel", "CoreWLANTypes"] }
objc2-core-location = { version = "0.3", features = ["CLLocationManager", "CLError"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi"] }

# The secure store on Linux: Secret Service over D-Bus (GNOME Keyring,
# KWallet). Without a Linux feature keyring 3 falls back to its MOCK store
# (keyring/src/lib.rs) — the drone's Wi-Fi password would "save" and be gone at
# the next launch, silently. crypto-rust avoids linking OpenSSL. Needs the
# libdbus-1 headers to build (scripts/setup.mjs checks for them). Cargo unifies
# these features with the macOS/Windows ones above.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
