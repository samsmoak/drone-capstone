[project]
name = "cropwatcher-agent"
version = "0.1.0"
description = "CropWatcher flight agent — the only process that talks to the Crazyradio"
requires-python = ">=3.11"

dependencies = [
    "cflib>=0.1.33",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "supabase>=2.9",
    "python-dotenv>=1.0",
    # Intel Macs only. cryptography 49+ publishes macOS wheels for Apple silicon
    # alone, so on Intel pip COMPILES it, against Homebrew's OpenSSL — and the
    # frozen agent then carries two libssl.3.dylib under one name, keeps
    # Python's older one, and cannot import cryptography, so it cannot sign in
    # ("Symbol not found: _SSL_get0_group_name", 2026-09-25). 48.x is the last
    # line with a prebuilt Intel wheel, which carries its own OpenSSL. Arrives
    # through supabase-auth → pyjwt[crypto]. Lift when upstream ships Intel
    # wheels again or Intel Macs stop mattering.
    "cryptography>=46,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Required by fastapi.testclient. Starlette warns that it prefers httpx2;
    # httpx still works and switching is not worth a behaviour change in the
    # test harness right now.
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]
# Freezing the agent into the desktop app's sidecar (packaging/build_sidecar.py).
# One declaration, so `node scripts/setup.mjs` and CI install the same thing.
packaging = [
    "pyinstaller>=6.10",
]
# The GUI planner and analysis notebooks are not needed to fly.
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.scripts]
cropwatcher = "cropwatcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cropwatcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hardware tests are opt-in: the suite must pass on a laptop with no drone.
markers = ["hardware: requires a connected Crazyradio and drone"]
addopts = "-m 'not hardware'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
# cflib ships no type stubs.
[[tool.mypy.overrides]]
module = ["cflib.*", "supabase.*"]
ignore_missing_imports = true
