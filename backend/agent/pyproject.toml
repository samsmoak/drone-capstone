[project]
name = "cropwatcher-agent"
version = "0.1.0"
description = "CropWatcher flight agent — the only process that talks to the Crazyradio"
requires-python = ">=3.11"

dependencies = [
    "cflib>=0.1.33",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "supabase>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
# The GUI planner and analysis notebooks are not needed to fly.
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.scripts]
cropwatcher = "cropwatcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cropwatcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hardware tests are opt-in: the suite must pass on a laptop with no drone.
markers = ["hardware: requires a connected Crazyradio and drone"]
addopts = "-m 'not hardware'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
# cflib ships no type stubs.
[[tool.mypy.overrides]]
module = ["cflib.*", "supabase.*"]
ignore_missing_imports = true
