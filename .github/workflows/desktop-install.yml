# Prove the terminal install works on every kind of machine it is meant for.
#
# CropWatcher is installed from a terminal, not downloaded (decided
# 2026-09-25):
#
#   git clone https://github.com/samsmoak/drone-capstone.git
#   cd drone-capstone
#   node scripts/install.mjs
#
# So that exact command is what runs here, on the four kinds of machine
# people have: an Apple-silicon Mac, an Intel Mac, a Windows PC and a Linux PC. It checks
# the toolchain, installs the agent and the app's packages, freezes and
# verifies the agent (verify_sidecar.py: USB, HTTP, WebSocket, and that
# closing stdin stops it), builds the app and installs it. A green run means a
# person on that machine gets an installed app from those three lines.
#
# Nothing is uploaded, so this needs no secrets. (It used to publish
# installers to a Supabase bucket; the Windows one had outgrown the 50 MB
# upload limit since numpy and scipy joined the agent on 2026-09-22.)
#
# Each OS and CPU runs on its own runner because nothing here cross-compiles:
# PyInstaller freezes for the CPU of the Python running it. macos-15-intel is
# GitHub's Intel image for public repositories (checked 2026-09-25).
#
# The path filter keeps a docs-only or web-only change from spending three
# runners on an install it cannot affect. Add to it, never remove it.

name: desktop-install

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "backend/agent/**"
      - "scripts/**"
      - ".github/workflows/desktop-install.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "backend/agent/**"
      - "scripts/**"
      - ".github/workflows/desktop-install.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR makes the older run moot.
concurrency:
  group: desktop-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Linux only: what a person installs first, exactly as setup.mjs prints
      # it for Debian/Ubuntu — Tauri's prerequisites
      # (https://v2.tauri.app/start/prerequisites/) plus the D-Bus headers the
      # Wi-Fi password store needs. desktop-file-utils validates the menu entry.
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
            pkg-config desktop-file-utils

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: node scripts/install.mjs
        env:
          # The Python setup-python installed, not whichever one PATH finds first.
          CROPWATCHER_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node scripts/install.mjs

      # The frozen agent must SIGN IN on this machine, not only start: an Intel
      # Mac's agent started, answered, and failed every sign-in (2026-09-25)
      # while verify_sidecar.py — offline by design — passed. This reaches the
      # real Supabase with an account that cannot exist and expects the
      # agent's own refusal.
      - name: The frozen agent can sign in
        run: |
          PY=backend/agent/.venv/bin/python
          [ -x "$PY" ] || PY=backend/agent/.venv/Scripts/python.exe
          "$PY" backend/agent/packaging/check_sign_in.py desktop/src-tauri/bin/cropwatcher-agent-*

      # Linux only: the per-user install landed, and its menu entry is valid
      # under the Desktop Entry Specification.
      - name: The Linux install is in place
        if: runner.os == 'Linux'
        run: |
          test -x ~/.local/lib/cropwatcher/desktop
          test -x ~/.local/lib/cropwatcher/cropwatcher-agent
          test -L ~/.local/bin/cropwatcher
          test -f ~/.local/share/icons/hicolor/128x128/apps/cropwatcher.png
          desktop-file-validate ~/.local/share/applications/cropwatcher.desktop
          cat ~/.local/share/applications/cropwatcher.desktop
