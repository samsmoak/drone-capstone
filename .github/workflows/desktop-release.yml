# Build the desktop installers and publish them to the website.
#
# Runs on every push to main that can change the app, and on a version tag:
#
#   git push origin main              (desktop/ or backend/agent/ changed)
#   git tag v0.1.0 && git push origin v0.1.0
#
# The path filter is the point, not a saving: a commit that touches only docs
# or web/ cannot change the installer, so rebuilding it would republish an
# identical binary after twenty minutes of macOS and Windows runners. Anything
# that CAN change the app is listed below — add to that list, never remove the
# filter, or the download silently falls behind the code.
#
# The filter applies to the tag trigger too, so tagging a commit that changed
# none of those paths does not rebuild. That is the correct outcome (the build
# is already current), and "Run workflow" forces one either way.
#
# Each OS builds on its own runner because neither half can cross-compile:
# PyInstaller freezes for the platform it runs on, and Tauri bundles for the
# platform it runs on. There is no way to produce the .exe from a Mac.
#
# The sidecar is verified *before* Tauri bundles it: `pnpm tauri build` runs
# beforeBuildCommand → `pnpm sidecar` → packaging/build_sidecar.py, which runs
# verify_sidecar.py. A frozen agent that cannot load libusb still builds
# cleanly and still launches — it only fails when a radio is plugged in — so
# the check has to be here, not on a user's laptop.
#
# The machine is set up by `node scripts/setup.mjs`, the same command a person
# runs after cloning. CI running it on every OS is what proves it works there.
#
# Pull requests build too, so a change is proven on every OS before it merges
# — the Windows build failed on every push to main for days, unseen, because
# main was the first place it ran. A pull request never uploads anything.
#
# Upload to Supabase Storage runs only when both secrets are set, so the
# workflow is useful (artifacts on the run page) before they are:
#   SUPABASE_URL                 https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    the only credential that can write the bucket

name: desktop-release

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "backend/agent/**"
      - "scripts/setup.mjs"
      - ".github/workflows/desktop-release.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "backend/agent/**"
      - "scripts/setup.mjs"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time. Two pushes in a minute would otherwise race to
# overwrite the same object, and the slower build could win. Pull requests get
# a group each: they publish nothing, and sharing the publishers' group would
# let a PR build cancel a publish from main.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('desktop-release-pr-{0}', github.ref) || 'desktop-release' }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple silicon, so this is an arm64 build only.
          - os: macos-latest
            installer_glob: desktop/src-tauri/target/release/bundle/dmg/*.dmg
            object: latest/CropWatcher-macos.dmg
            content_type: application/x-apple-diskimage
          - os: windows-latest
            installer_glob: desktop/src-tauri/target/release/bundle/nsis/*.exe
            object: latest/CropWatcher-windows.exe
            content_type: application/vnd.microsoft.portable-executable

    runs-on: ${{ matrix.os }}
    # Job level, not step level: a step's own `env` is not visible to that
    # step's `if:`, so the upload would silently always skip.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # Checks the toolchain, creates the agent's venv, installs it with
      # PyInstaller, and installs the desktop packages from the lockfile.
      - name: Set up (node scripts/setup.mjs)
        env:
          # The Python setup-python installed, not whichever one PATH finds first.
          CROPWATCHER_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node scripts/setup.mjs

      # Freezes and verifies the agent first (beforeBuildCommand), then builds.
      - name: Build installer
        working-directory: desktop
        run: pnpm tauri build

      - name: Locate installer
        id: installer
        run: |
          files=( ${{ matrix.installer_glob }} )
          if [[ ! -f "${files[0]}" ]]; then
            echo "No installer matched ${{ matrix.installer_glob }}" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Upload to Supabase Storage
        if: ${{ github.event_name != 'pull_request' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          # --fail so a rejected upload fails the job instead of printing JSON
          # and going green.
          curl --fail-with-body -sS -X POST \
            "$SUPABASE_URL/storage/v1/object/installers/${{ matrix.object }}" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: ${{ matrix.content_type }}" \
            --data-binary "@${{ steps.installer.outputs.path }}"

  # What the /apps page says about the build: version, commit and when. Its own
  # job, because it must be written once, after BOTH installers are up — a
  # manifest that names a version only one platform has is worse than none.
  manifest:
    needs: build
    if: ${{ always() && needs.build.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish the manifest
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          cat > manifest.json <<JSON
          {
            "version": "$version",
            "commit": "${GITHUB_SHA}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON
          curl --fail-with-body -sS -X POST \
            "$SUPABASE_URL/storage/v1/object/installers/latest/manifest.json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/json" \
            -H "Cache-Control: max-age=60" \
            --data-binary @manifest.json
