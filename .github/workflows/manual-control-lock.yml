# Manual flight control is locked: only Samuel (the owner) changes how the keys
# fly the drone (CLAUDE.md, "Manual flight control is locked"). This runs the
# fingerprint check on every pull request that touches those files, so a change
# shows red on the PR until its fingerprint is updated for Samuel's review.
# Standard library and pytest only: seconds, no drone, no build.
name: manual-control-lock

on:
  push:
    branches: [main]
    paths:
      - "backend/agent/cropwatcher/flight/manual.py"
      - "backend/agent/cropwatcher/flight/keyframe.py"
      - "backend/agent/cropwatcher/flight/tuning.py"
      - "backend/agent/tests/test_manual_control_lock.py"
      - "desktop/src/lib/keys.ts"
      - "CLAUDE.md"
      - ".github/CODEOWNERS"
      - ".github/workflows/manual-control-lock.yml"
  pull_request:
    paths:
      - "backend/agent/cropwatcher/flight/manual.py"
      - "backend/agent/cropwatcher/flight/keyframe.py"
      - "backend/agent/cropwatcher/flight/tuning.py"
      - "backend/agent/tests/test_manual_control_lock.py"
      - "desktop/src/lib/keys.ts"
      - "CLAUDE.md"
      - ".github/CODEOWNERS"
      - ".github/workflows/manual-control-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Manual flight control is unchanged
        working-directory: backend/agent
        run: python -m pytest -p no:cacheprovider tests/test_manual_control_lock.py -v
