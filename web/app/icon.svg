<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CropWatcher">
  <!--
    The same mark as the desktop app's sidebar: a "C" on the primary square.
    Raw hex is allowed here because an icon is a static asset read by the
    browser and the OS before any stylesheet exists — it cannot reference
    var(--primary). The value is the token's: #1c5cab on #ffffff.
  -->
  <rect width="64" height="64" fill="#1c5cab"/>
  <path
    d="M44 21.5a15 15 0 1 0 0 21"
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="round"
  />
</svg>
